<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICEhash</title>
    <link rel="stylesheet" href="../style/index.css">
</head>
<body>
<section class="section">
    <div class="container">
        <h1 class="title">ICEhash</h1>
        <p class="subtitle">Це тестова сторінка для перевірки функціональності.</p>
    </div>
</section>

<section>
    <div class="registertransaction">

        <div class="auth-tabs">
            <button type="button" class="auth-tab active" data-target="register">Реєстрація</button>
            <button type="button" class="auth-tab" data-target="login">Вхід</button>
        </div>

        <p class="form-error" id="form-error" hidden></p>

        <!-- ===== ФОРМА РЕЄСТРАЦІЇ ===== -->
        <div class="auth-panel" id="register-panel">
            <h2 class="title">Реєстрація</h2>
            <p class="subtitle">Зареєструйтеся, щоб отримати доступ до особистого кабінету.</p>

            <form class="register-form" id="register-form">
                <div class="form-group">
                    <label for="username">Ім'я користувача</label>
                    <input type="text" id="username" name="username" required>

                    <label for="email">Електронна пошта</label>
                    <input type="email" id="email" name="email" required>

                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" required minlength="8">

                    <label for="confirm-password">Підтвердження пароля</label>
                    <input type="password" id="confirm-password" name="confirm-password" required minlength="8">

                    <label><input type="checkbox" checked required> Я погоджуюся з <a href="../html/terms.html">умовами використання</a> та <a href="../html/privacy.html">політикою конфіденційності</a>.</label>

                    <button type="submit">Зареєструватися</button>
                </div>
            </form>

            <p class="login-link">Вже маєте акаунт? <a href="#" data-target="login">Увійти</a></p>
        </div>

        <!-- ===== ФОРМА ВХОДУ ===== -->
        <div class="auth-panel" id="login-panel" hidden>
            <h2 class="title">Вхід</h2>
            <p class="subtitle">Введіть дані свого акаунта, щоб продовжити.</p>

            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="login-username">Ім'я користувача</label>
                    <input type="text" id="login-username" name="login-username" required>

                    <label for="login-password">Пароль</label>
                    <input type="password" id="login-password" name="login-password" required>
                    
                    <Label> <input type="checkbox" checked required> Запам'ятати мене</Label>

                    <button type="submit">Увійти</button>
                    
                </div>
            </form>

            <p class="register-link">Ще немає акаунта? <a href="#" data-target="register">Зареєструватися</a></p>
        </div>

    </div>
</section>

<script>
    // ===== Перемикання вкладок "Реєстрація / Вхід" =====
    const tabs = document.querySelectorAll('.auth-tab');
    const panels = {
        register: document.getElementById('register-panel'),
        login: document.getElementById('login-panel')
    };
    const errorBox = document.getElementById('form-error');

    function switchTo(target){
        Object.keys(panels).forEach(key => {
            panels[key].hidden = key !== target;
        });
        tabs.forEach(tab => {
            tab.classList.toggle('active', tab.dataset.target === target);
        });
        hideError();
    }

    tabs.forEach(tab => {
        tab.addEventListener('click', () => switchTo(tab.dataset.target));
    });

    document.querySelectorAll('.login-link a, .register-link a').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            switchTo(link.dataset.target);
        });
    });

    function showError(message){
        errorBox.textContent = message;
        errorBox.hidden = false;
    }

    function hideError(){
        errorBox.hidden = true;
    }

    // ===== Відправка форм на бекенд (Flask, app.py) =====
    // Якщо index.html відкривається не через сам Flask-сервер
    // (а, наприклад, Live Server на іншому порту), пропишіть сюди
    // повну адресу: const API_BASE = 'http://127.0.0.1:5000';
    const API_BASE = '';

    async function sendJSON(url, payload){
        const res = await fetch(API_BASE + url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include', // обов'язково — несе сесійну cookie
            body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
            throw new Error(data.error || 'Сталася помилка. Спробуйте ще раз.');
        }
        return data;
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const form = e.target;
        const payload = {
            username: form.username.value.trim(),
            email: form.email.value.trim(),
            password: form.password.value,
            confirm_password: form['confirm-password'].value,
        };

        try {
            const data = await sendJSON('/register', payload);
            window.location.href = data.redirect || '/profile.html';
        } catch (err) {
            showError(err.message);
        }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        hideError();

        const form = e.target;
        const payload = {
            username: form['login-username'].value.trim(),
            password: form['login-password'].value,
        };

        try {
            const data = await sendJSON('/login', payload);
            window.location.href = data.redirect || '/profile.html';
        } catch (err) {
            showError(err.message);
        }
    });
</script>

</body>
</html>
